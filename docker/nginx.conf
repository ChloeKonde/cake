server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ES modules import each other without version queries, so code must always be
    # revalidated (cheap 304 via ETag) or browsers mix old and new modules after a deploy.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(svg|png|ico)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
