<html lang="ru">

  <meta property="og:title" content="Кексомагия | Cake Magic">

<body data-step="start">
  <div class="bg" aria-hidden="true">

  </div>

  <header class="top">
    <button class="logo" id="home" aria-label="Home"><img src="favicon.svg" alt="" width="34" height="34"><b>Кексомагия</b></button>
    <ol class="steps" id="steps" hidden></ol>
    <div class="tools">
      <button class="pill" id="lang">EN</button>
      <button class="pill" id="snd" aria-label="Sound"></button>
    </div>
  </header>

  <main class="app">
    <section class="stage">
      <div class="scene" id="scene"></div>
      <div class="chef-wrap">
        <button class="chef" id="chef" aria-label="Chef Murzik"></button>
        <div class="bubble" id="bubble" hidden><svg class="tail" viewBox="0 0 17 24" aria-hidden="true"><path d="M17 0 1.5 12 17 24Z" fill="#fff"/><path d="M15.5 1.5 1.5 12 15.5 22.5" fill="none" stroke="#3d2314" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="btext" aria-live="polite"></span></div>
      </div>
    </section>
    <section class="panel" id="panel"></section>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>
  <script type="module" src="js/main.js?v=6"></script>

</html>
